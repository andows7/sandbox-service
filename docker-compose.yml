services:
  sandbox-service:
    build: ./backend
    container_name: sandbox-service
    ports:
      - "127.0.0.1:8084:8084"
    mem_limit: 384m
    cpus: 1.0
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # If using Nacos in prod, replace below IPs with real Nacos server IP
      - NACOS_ADDR=${NACOS_ADDR:-nacos:8848}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/huixue_sandbox?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SANDBOX_DOCKER_HOST=unix:///var/run/docker.sock
      - SANDBOX_WORK_DIR=/app/sandbox_workdirs
      - SANDBOX_HOST_WORK_DIR=${SANDBOX_HOST_WORK_DIR:?Set absolute Docker-host workspace path}/backend/sandbox_workdirs
    volumes:
      # Mount the Docker socket so the sandbox manager can spawn inner containers (Docker-out-of-Docker / sibling containers)
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/sandbox_workdirs:/app/sandbox_workdirs
    restart: always
